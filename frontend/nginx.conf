server {
  listen 80;
  root /usr/share/nginx/html;

  # /api/expenses -> http://backend:3100/expenses
  location /api/ {
    proxy_pass http://backend:3100/;
    proxy_set_header Host $host;
  }

  # SPA: cualquier ruta (/pagos, /calendario...) devuelve index.html y React Router decide qué mostrar
  location / {
    try_files $uri $uri/ /index.html;
  }
}
