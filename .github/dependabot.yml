# Dependabot: mantiene las dependencias al día con PRs automáticos hacia develop.
#  - Una vez por mes, todo agrupado: un PR por carpeta como mucho.
#  - Solo versiones menores y parches. Las mayores (que pueden romper compatibilidad)
#    se actualizan a mano, a propósito, en una rama propia.
#  - Las alertas de seguridad son aparte (Settings -> Code security) y siguen activas.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      menores:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /backend
    target-branch: develop
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      menores:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
