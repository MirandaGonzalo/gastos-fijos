# Dependabot: abre PRs para mantener las dependencias al día (agrupadas para no llenar de PRs)
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      menores: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    groups:
      menores: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
